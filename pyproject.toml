[build-system]
requires = ["setuptools>=75", "wheel", "pybind11>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorize-server"
version = "0.2.0"
description = "Convert artwork and photographs into editable SVGs with a CPU-native engine, browser UI, REST API, and Docker."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.0", "uvicorn==0.54.0", "python-multipart==0.0.32",
  "pillow==12.3.0", "numpy==2.5.4", "scipy==1.18.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "httpx>=0.28", "mypy>=1.15", "black>=25", "ruff>=0.11", "cairosvg>=2.7", "build>=1.2", "scikit-image>=0.26"]

[project.scripts]
vectorize = "vector_server.cli:main"
vectorize-server = "vector_server.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vector_server = ["py.typed", "*.pyi", "*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["scipy.*", "skimage.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["vector_server"]
branch = true

[tool.coverage.report]
show_missing = true
